# LongContext A: user prompt injection, p=.001.
backend: chat
model: deepseek-v4.1-flash-go
model_fallbacks: []

benchmark: longcontext
benchmark_path: ../data/pilot/longcontext.jsonl

site: context
inject_user: true
inject_tool: false
fault:
  mode: single
  prob: 0.001
  width: 8
  seed: 1
tools: []

limit: 3
dry_run: false
runs_dir: runs/longcontext-deepseek-v4.1-flash-go-opencode
chat_retries: 1
chat_retry_sleep: 5
chat_timeout: 300
