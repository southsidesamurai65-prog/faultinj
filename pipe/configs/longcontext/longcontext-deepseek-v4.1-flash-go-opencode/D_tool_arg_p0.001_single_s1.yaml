# LongContext D: tool-argument injection, p=.001.
# Long-context prompts use no tools, so this is expected to be a no-op.
backend: chat
model: deepseek-v4.1-flash-go
model_fallbacks: []

benchmark: longcontext
benchmark_path: ../data/pilot/longcontext.jsonl

site: tool
inject_user: false
inject_tool: false
fault:
  mode: single
  prob: 0.001
  width: 8
  seed: 1
tools: []

limit: 3
dry_run: false
runs_dir: runs/longcontext-deepseek-v4.1-flash-go-opencode
chat_retries: 1
chat_retry_sleep: 5
chat_timeout: 300
