# LongContext E: assistant-history injection, p=.001.
# Uses the two-turn self-check so there is a prior assistant answer to inject.
backend: chat
model: deepseek-v4.1-flash-go
model_fallbacks: []

benchmark: longcontext-selfcheck
benchmark_path: ../data/pilot/longcontext.jsonl

site: context
inject_user: false
inject_tool: false
inject_assistant: true
fault:
  mode: single
  prob: 0.001
  width: 8
  seed: 1
tools: []

limit: 3
dry_run: false
runs_dir: runs/longcontext-deepseek-v4.1-flash-go-opencode
chat_retries: 1
chat_retry_sleep: 5
chat_timeout: 300
