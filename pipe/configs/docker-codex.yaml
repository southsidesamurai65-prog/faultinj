# Docker container backend x codex x gpt-6-luna x NL2Repo-Bench
backend: docker
harness: codex
model: gpt-6-luna

benchmark: nl2repo
benchmark_path: ../data/nl2repo/test_files
image_template: "ghcr.io/multimodal-art-projection/nl2repobench/{name}:latest"
container_workdir: /app

site: context
fault:
  mode: burst
  prob: 0.001
  width: 8
  seed: 1
tools: []
log_path: fault-inject.log.jsonl

limit: 1
dry_run: true

build_image: false
